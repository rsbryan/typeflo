[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "typeflo"
version = "0.2.0"
description = "On-device push-to-talk dictation for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "parakeet-mlx==0.5.3",
    "mlx-lm==0.32.0",
    "numpy>=2.2.5,<3",
    "huggingface-hub>=0.30.2,<2",
    "sounddevice>=0.5,<0.6",
    "rumps>=0.4,<0.5",
    "pyobjc-framework-Cocoa>=11,<13",
    "pyobjc-framework-Quartz>=11,<13",
    "pyobjc-framework-ApplicationServices>=11,<13",
    "pyobjc-framework-WebKit>=11,<13",
    "pyobjc-framework-AVFoundation>=11,<13",
]

[project.scripts]
typeflo = "dictate.app:main"
dictate = "dictate.app:main"

[dependency-groups]
build = ["pyinstaller>=6.22,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/dictate"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
